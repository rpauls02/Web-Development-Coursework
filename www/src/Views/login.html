<!DOCTYPE html>
<html lang="en-gb">

{% include 'head.html' %}

<body>
    {% include 'header.html' %}

    <main class="content" id="login-page">
        <div class="form-title-container">
            <h1>Login</h1>
            <p>New to us? <a href="/register">Create an account</a></p>
        </div>
        
        <div class="login-form-container">
            <form class="login-form" action="/api/authenticate" method="post">
                <div class="form-group">
                    <label for="email" class="input-label">
                        <i class="fa-solid fa-user"></i>
                    </label>
                    <input type="text" name="email" placeholder="Email" id="email" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="input-label">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input type="password" name="password" placeholder="Password" id="password" required>
                </div>

                <div id="remember-me-group">
                    <input type="checkbox" name="remember-me" id="remember-me">
                    <label id="remember-me-label" for="remember-me">Remember me</label>
                </div>

                <input class="submit-button" type="submit" value="Login">

                {% if error %}
                <div class="error-msg-panel">
                    <p>{{ error|raw }}</p>
                </div>
                {% endif %}

                {% if success %}
                <div class="success-msg-panel">
                    <p>{{success}}</p>
                </div>
                {% endif %}
            </form>
        </div>
    </main>

    {% include 'footer.html' %}
</body>

</html>
