<!DOCTYPE html>
<html lang="en-gb">

{% include 'head.html' %}

<body>
    {% include 'header.html' %}

    <main class="content" id="register-page">
        <div class="form-title-container">
            <h1>Create Account</h1>
            <p>Already registered? <a href="/login">Login here</a></p>
        </div>

        <div class="register-form-container">
            <form class="register-form" action="/api/create_account" method="post">
                <div class="form-group">
                    <label for="fname" class="input-label">
                        <i class="fa-solid fa-user"></i>
                    </label>
                    <input type="text" name="fname" placeholder="First Name" id="fname" required>
                </div>

                <div class="form-group">
                    <label for="sname" class="input-label">
                        <i class="fa-solid fa-user"></i>
                    </label>
                    <input type="text" name="sname" placeholder="Last Name" id="sname" required>
                </div>

                <div class="form-group">
                    <label for="dob" class="input-label">
                        <i class="fa-solid fa-cake-candles"></i>
                    </label>
                    <input type="date" name="dob" id="dob" required placeholder="Date of birth" />
                </div>

                <div class="form-group">
                    <label for="email" class="input-label">
                        <i class="fa-solid fa-envelope"></i>
                    </label>
                    <input type="text" name="email" placeholder="Email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="mobile" class="input-label">
                        <i class="fa-solid fa-mobile"></i>
                    </label>
                    <input type="text" name="mobile" placeholder="Mobile Number" id="mobile" required>
                </div>

                <div class="form-group">
                    <label for="password" class="input-label">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input type="password" name="password" placeholder="Password" id="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="input-label">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <input type="password" name="confirm-password" placeholder="Confirm password" id="confirm-password"
                        required>
                </div>

                <input class="submit-button" type="submit" value="Submit">

                {% if error %}
                <div class="error-msg-panel">
                    <p>{{ error|raw }}</p>
                </div>
                {% endif %}

                {% if success %}
                <div class="success-msg-panel">
                    <p>{{ success }}</p>
                </div>
                {% endif %}
            </form>
        </div>
    </main>

    {% include 'footer.html' %}
</body>

</html>
